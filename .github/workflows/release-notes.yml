name: Release Notes

on:
  workflow_call:

jobs:
  create-releases:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Publish pushes release commits after this workflow started; use main tip.
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Sync main and tags
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git checkout -B main origin/main

      - name: Create GitHub Releases from changelogs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          changelog_for() {
            case "$1" in
              '@maxigarcia/access-token') echo 'packages/access-token/CHANGELOG.md' ;;
              'app') echo 'packages/app/CHANGELOG.md' ;;
              *) return 1 ;;
            esac
          }

          extract_section() {
            local file="$1" version="$2"
            awk -v ver="$version" '
              $0 ~ "^## " ver "( |$)" {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' "$file"
          }

          # Collect tags from every release commit on main (lib + app may be separate commits).
          tags=$(
            git log origin/main --grep='^chore(release):' --format='%H' |
              while read -r commit; do
                git tag --points-at "$commit" | grep '@' || true
              done |
              sort -u
          )

          if [ -z "$tags" ]; then
            echo "No package tags found on release commits."
            exit 0
          fi

          for tag in $tags; do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping."
              continue
            fi

            project="${tag%@*}"
            version="${tag##*@}"
            if ! changelog=$(changelog_for "$project"); then
              echo "No changelog mapping for $project, skipping $tag"
              continue
            fi

            # Read changelog from the tagged commit so notes match that release.
            changelog_file=$(mktemp)
            git show "$tag:$changelog" > "$changelog_file"
            notes=$(extract_section "$changelog_file" "$version")
            rm -f "$changelog_file"

            if [ -z "$notes" ]; then
              echo "No changelog section for $tag in $changelog, skipping."
              continue
            fi

            notes_file=$(mktemp)
            printf '%s\n' "$notes" > "$notes_file"

            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file "$notes_file" \
              --verify-tag

            rm -f "$notes_file"
            echo "Created release $tag"
          done
